name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit tests avoid model downloads; CPU torch covers the attention-span test.
      - run: pip install "numpy>=2.0,<3" "pillow>=11,<12" "matplotlib>=3.9,<4"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
