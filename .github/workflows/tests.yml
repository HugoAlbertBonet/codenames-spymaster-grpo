name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tiny locally constructed models test adapter gradients/checkpoint recovery;
      # no pretrained model weights or GPU are needed.
      - run: pip install "numpy>=2.0,<3" "pillow>=11,<12" "matplotlib>=3.9,<4"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.47,<5" "peft>=0.14,<1" "accelerate>=1.2,<2" "datasets>=3.2,<4"
      - run: python -m unittest discover -s tests -v
