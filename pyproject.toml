[project]
name = "codenames-spymaster"
version = "0.1.0"
description = "Training a small language model to play the Codenames spymaster with GRPO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.2,<2",
    "datasets>=3.2,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "peft>=0.14,<1",
    "pillow>=11,<12",
    "sentence-transformers>=3.3,<4",
    "torch>=2.5,<3",
    "transformers>=4.47,<5",
    "trl>=0.14,<0.15",
]

[tool.uv]
package = false
